<html>
  <head><title>Widget</title>
  </head>
<body>
<style>
  .comment {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .comment .card {
    border: 1px solid #444;
    padding: .5em;
    margin-bottom: 1em;
  }
  .comment .user {
    font-weight: 600;
  }
  .comment button {
    background-color: transparent;
    text-decoration: underline;
    font-size: .9em;
    border: none;
  }
  .replies {
    margin-left: 2em;
  }
</style>
<div id="comment-widget">
  <h3>Comments</h3>

  <canary-comments api-url="http://localhost:9000/_canary/"></canary-comments>

  <hr>

  <h4>New comment</h4>
  <form id="new-comment-form">
    <textarea id="text" placeholder="comment..." required></textarea>
    <br>
    <button type="submit">Post</button>
  </form>
</div>

<script src="canary.js"></script>
</body>
</html>
